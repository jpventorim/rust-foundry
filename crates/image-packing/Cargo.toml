[package]
name = "image-packing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pack images with independent quantities into multi-page printable PDFs"

[[bin]]
name = "image-packing"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
anyhow = { version = "1.0.104", optional = true }
bin-packing = { version = "0.6.0", default-features = false, features = ["two-d"] }
image.workspace = true
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
lopdf = "0.47.0"
