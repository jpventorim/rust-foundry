[workspace]
members = ["crates/image-packing"]
exclude = ["src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
